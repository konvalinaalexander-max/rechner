<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nährstoffbilanz – Suisse-Bilanz</title>
<style>/*[[CSS]]*/</style>
</head>
<body>

<header>
  <div class="marke">
    <h1>Nährstoffbilanz</h1>
    <div class="sub" id="kopfinfo">Referenzmethode Suisse-Bilanz</div>
  </div>
  <div class="spacer"></div>
  <div class="werkzeuge">
    <button class="knopf" onclick="sbSpeichern()" title="Alle Eingaben als Datei sichern">Speichern</button>
    <label class="knopf" title="Gesicherte Datei einlesen">Laden<input type="file" accept=".json,application/json" onchange="sbLaden(event)"></label>
    <button class="knopf" onclick="sbVorlage()" title="Betriebsvorlage laden">Vorlage</button>
    <button class="knopf" onclick="sbNeu()" title="Leere Bilanz beginnen">Neu</button>
    <button class="knopf stark" onclick="sbDrucken()">PDF</button>
  </div>
</header>

<div class="kopfleiste">
  <div class="bilanzleiste" id="bilanzleiste"></div>
  <nav id="nav"></nav>
</div>
<main id="inhalt"></main>

<div id="dialogbereich"></div>
<div id="druck"></div>

<script>/*[[JS]]*/</script>
</body>
</html>
