<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nährstoffbilanz – Suisse-Bilanz</title>
<style>/* =============================================================================
   Nährstoffbilanz – Gestaltung
   ============================================================================= */
:root{
  --gruen:#2f6b3a; --gruen-dunkel:#1e4527; --gruen-hell:#eef4ec; --gruen-rand:#c5d9c2;
  --papier:#f6f5f1; --karte:#fff; --tinte:#23231d; --grau:#6b6b62; --grau-hell:#9a9a90;
  --linie:#e0dcd2; --linie-stark:#c9c5b8;
  --gelb:#f5efd6; --gelb-rand:#e0d19a; --gelb-tinte:#7a5f13;
  --rot:#a5382a; --rot-hell:#fbeae7; --rot-rand:#e8c4bd;
  --blau:#33566f; --blau-hell:#eaf0f4; --blau-rand:#c3d5e0;
  --eingabe:#fffdf4;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  background:var(--papier); color:var(--tinte); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-weight:600;margin:0}

/* ---------- Kopfzeile ---------- */
header{background:var(--gruen-dunkel);color:#fff;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header .marke h1{font-size:17px;letter-spacing:.01em;line-height:1.2}
header .marke .sub{font-size:11.5px;opacity:.72;margin-top:1px}
header .spacer{flex:1}
header .werkzeuge{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
header label.vlabel{font-size:11.5px;opacity:.8;margin-right:-2px}
.knopf{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:6px;
  padding:6px 11px;font-size:12.5px;font-family:inherit;cursor:pointer;white-space:nowrap}
.knopf:hover{background:rgba(255,255,255,.24)}
.knopf.stark{background:#fff;color:var(--gruen-dunkel);border-color:#fff;font-weight:600}
.knopf input[type=file]{display:none}
header select{background:#fff;color:var(--tinte);border:0;border-radius:6px;padding:6px 9px;font-size:12.5px;font-family:inherit}

/* ---------- Kopfleiste: Bilanzwerte und Navigation bleiben gemeinsam sichtbar ---------- */
.kopfleiste{position:sticky;top:0;z-index:40;box-shadow:0 1px 5px rgba(0,0,0,.08)}
.bilanzleiste{background:var(--karte);border-bottom:1px solid var(--linie);
  display:flex;gap:0;align-items:stretch;overflow-x:auto}
.bilanzleiste .zelle{padding:9px 18px;border-right:1px solid var(--linie);min-width:150px;flex-shrink:0}
.bilanzleiste .zelle:last-child{border-right:0}
.bilanzleiste .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--grau);white-space:nowrap}
.bilanzleiste .wert{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.bilanzleiste .wert small{font-size:11px;font-weight:500;color:var(--grau)}
.bilanzleiste .zelle.klick{cursor:pointer}
.bilanzleiste .zelle.klick:hover{background:var(--gruen-hell)}
.gut{color:var(--gruen)} .schlecht{color:var(--rot)} .neutral{color:var(--blau)}

/* ---------- Navigation ---------- */
nav{display:flex;background:var(--gruen);padding:0 14px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#d9e6d6;padding:10px 13px;font-size:13px;font-family:inherit;
  cursor:pointer;border-bottom:3px solid transparent;display:flex;align-items:center;gap:6px}
nav button:hover{color:#fff}
nav button.aktiv{color:#fff;border-bottom-color:var(--gelb-rand);font-weight:600}
nav button .nr{background:rgba(255,255,255,.2);border-radius:9px;padding:0 6px;font-size:10.5px;font-weight:700}
nav button.aktiv .nr{background:var(--gelb-rand);color:var(--gruen-dunkel)}
nav button .punkt{width:7px;height:7px;border-radius:50%;background:var(--rot);display:inline-block}

main{max-width:1240px;margin:0 auto;padding:18px 20px 70px}

/* ---------- Karten ---------- */
.karte{background:var(--karte);border:1px solid var(--linie);border-radius:9px;padding:16px 18px;margin-bottom:16px}
.karte > h2{font-size:15.5px;color:var(--gruen-dunkel);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.karte > h2 .form{font-size:10.5px;color:var(--grau);font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  background:var(--papier);border:1px solid var(--linie);border-radius:4px;padding:1px 6px}
.hinweis{font-size:12.5px;color:var(--grau);margin:5px 0 13px;max-width:80ch}
.karte h3{font-size:13px;color:var(--gruen-dunkel);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.05em}

/* ---------- Tabellen ---------- */
.tabellenrahmen{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--grau);text-align:left;
  padding:6px 7px;border-bottom:2px solid var(--linie-stark);font-weight:700;white-space:nowrap;vertical-align:bottom}
td{padding:5px 7px;border-bottom:1px solid var(--linie);vertical-align:middle}
td.num,th.num{text-align:right}
tbody tr:hover{background:#fbfaf7}
tr.gruppe td{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--grau);font-weight:700;
  background:var(--papier);padding-top:9px;padding-bottom:4px;border-bottom:1px solid var(--linie)}
tr.summe td{font-weight:700;border-top:2px solid var(--tinte);border-bottom:0;background:var(--gruen-hell)}
tr.zwischensumme td{font-weight:600;background:#f4f7f3;border-bottom:1px solid var(--linie-stark)}
.abgeleitet{color:var(--grau);font-variant-numeric:tabular-nums}
.zeileninfo{font-size:11px;color:var(--grau-hell);display:block;margin-top:1px}
.zeileninfo.warn{color:var(--gelb-tinte)}

/* ---------- Eingabefelder ---------- */
input[type=number],input[type=text],select,textarea{
  border:1px solid var(--linie-stark);border-radius:5px;padding:5px 7px;font-size:13px;
  font-family:inherit;background:var(--eingabe);color:var(--tinte)}
input[type=number],input.zahl{width:86px;text-align:right;font-variant-numeric:tabular-nums}
input.klein{width:62px} input.mini{width:50px} input.breit{width:100%;text-align:left}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gruen);outline-offset:-1px;background:#fff}
input:disabled{background:#f2f0ea;color:var(--grau-hell)}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--gruen);cursor:pointer}
.feldgruppe{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.feld label{display:block;font-size:11px;color:var(--grau);text-transform:uppercase;letter-spacing:.04em;
  margin-bottom:3px;font-weight:600}
.feld .einheit{font-size:11px;color:var(--grau-hell);margin-left:4px}

/* ---------- Buttons in Tabellen ---------- */
.plus{background:var(--gruen-hell);border:1px dashed var(--gruen-rand);color:var(--gruen-dunkel);border-radius:6px;
  padding:7px 13px;font-size:12.5px;font-family:inherit;cursor:pointer;margin-top:11px}
.plus:hover{background:#e3ede0}
.iknopf{background:none;border:0;color:var(--grau-hell);font-size:14px;cursor:pointer;padding:2px 5px;border-radius:4px;line-height:1}
.iknopf:hover{color:var(--rot);background:var(--rot-hell)}
.iknopf.stift:hover{color:var(--blau);background:var(--blau-hell)}

/* ---------- Kennzahlen ---------- */
.kennzahlen{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px;margin-top:13px}
.kennzahl{background:var(--gruen-hell);border:1px solid var(--gruen-rand);border-radius:7px;padding:10px 13px}
.kennzahl .w{font-size:20px;font-weight:700;color:var(--gruen-dunkel);font-variant-numeric:tabular-nums;line-height:1.2}
.kennzahl .l{font-size:11.5px;color:var(--grau);margin-top:2px;line-height:1.35}
.kennzahl.warn{background:var(--gelb);border-color:var(--gelb-rand)}
.kennzahl.warn .w{color:var(--gelb-tinte)}
.kennzahl.fehler{background:var(--rot-hell);border-color:var(--rot-rand)}
.kennzahl.fehler .w{color:var(--rot)}
.kennzahl.info{background:var(--blau-hell);border-color:var(--blau-rand)}
.kennzahl.info .w{color:var(--blau)}

/* ---------- Meldungen ---------- */
.meldung{border-radius:7px;padding:9px 13px;font-size:12.5px;margin:8px 0;border:1px solid;display:flex;gap:9px;align-items:flex-start}
.meldung .sym{font-weight:700;flex-shrink:0}
.meldung.fehler{background:var(--rot-hell);border-color:var(--rot-rand);color:#7d2a1f}
.meldung.warnung{background:var(--gelb);border-color:var(--gelb-rand);color:var(--gelb-tinte)}
.meldung.info{background:var(--blau-hell);border-color:var(--blau-rand);color:var(--blau)}
.meldung.erfolg{background:var(--gruen-hell);border-color:var(--gruen-rand);color:var(--gruen-dunkel)}
.notiz{background:var(--gelb);border:1px solid var(--gelb-rand);border-radius:6px;padding:9px 12px;
  font-size:12.5px;margin:10px 0;color:var(--gelb-tinte)}

/* ---------- Etiketten ---------- */
.etikett{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:9px;font-weight:600;white-space:nowrap}
.etikett.gruen{background:var(--gruen-hell);color:var(--gruen-dunkel);border:1px solid var(--gruen-rand)}
.etikett.gelb{background:var(--gelb);color:var(--gelb-tinte);border:1px solid var(--gelb-rand)}
.etikett.rot{background:var(--rot-hell);color:var(--rot);border:1px solid var(--rot-rand)}
.etikett.blau{background:var(--blau-hell);color:var(--blau);border:1px solid var(--blau-rand)}
.etikett.grau{background:var(--papier);color:var(--grau);border:1px solid var(--linie)}

/* ---------- Bilanzaufstellung ---------- */
.bilanztabelle{width:100%;border-collapse:collapse;font-size:14px}
.bilanztabelle td{padding:8px 10px;border-bottom:1px solid var(--linie)}
.bilanztabelle td.num{text-align:right;font-variant-numeric:tabular-nums;width:130px;font-weight:600}
.bilanztabelle tr.hervor td{background:#f4f7f3;font-weight:600}
.bilanztabelle tr.endsumme td{border-top:2.5px solid var(--tinte);border-bottom:0;font-size:16px;font-weight:700;
  background:var(--gruen-hell);padding:11px 10px}
.bilanztabelle .erklaerung{font-size:11.5px;color:var(--grau);font-weight:400;display:block}
.rechenweg{background:var(--papier);border:1px solid var(--linie);border-radius:6px;padding:10px 13px;
  font-size:12.5px;color:var(--grau);margin:10px 0;line-height:1.7}
.rechenweg b{color:var(--tinte)}

/* ---------- Auswahl-Dialog ---------- */
.overlay{position:fixed;inset:0;background:rgba(30,30,25,.45);z-index:100;display:flex;
  align-items:flex-start;justify-content:center;padding:6vh 16px 16px}
.dialog{background:var(--karte);border-radius:11px;width:100%;max-width:680px;max-height:82vh;
  display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.25);overflow:hidden}
.dialog .kopf{padding:14px 18px 10px;border-bottom:1px solid var(--linie)}
.dialog .kopf h3{font-size:15px;color:var(--gruen-dunkel);text-transform:none;letter-spacing:0;margin:0 0 9px}
.dialog .kopf input{width:100%;font-size:14px;padding:8px 11px}
.dialog .liste{overflow-y:auto;padding:5px 0;flex:1}
.dialog .liste .gr{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--grau);
  font-weight:700;padding:9px 18px 3px;background:var(--papier);position:sticky;top:0}
.dialog .liste button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 18px;
  font-size:13.5px;font-family:inherit;cursor:pointer;color:var(--tinte);border-bottom:1px solid #f2f0ea}
.dialog .liste button:hover,.dialog .liste button.markiert{background:var(--gruen-hell)}
.dialog .liste button .det{display:block;font-size:11.5px;color:var(--grau-hell);margin-top:1px}
.dialog .fuss{padding:11px 18px;border-top:1px solid var(--linie);display:flex;gap:9px;justify-content:space-between;align-items:center}
.dialog .fuss .hint{font-size:11.5px;color:var(--grau-hell)}
.knopf.dunkel{background:var(--gruen);border-color:var(--gruen);color:#fff}
.knopf.hell{background:var(--papier);border-color:var(--linie-stark);color:var(--tinte)}

/* ---------- Prüfung ---------- */
.testgruppe{margin-bottom:14px}
.testgruppe > .kopf{display:flex;justify-content:space-between;align-items:center;padding:7px 11px;
  background:var(--papier);border:1px solid var(--linie);border-radius:6px;font-size:13px;font-weight:600;cursor:pointer}
.testliste{border:1px solid var(--linie);border-top:0;border-radius:0 0 6px 6px}
.testzeile{display:flex;gap:9px;padding:4px 11px;font-size:12.5px;border-bottom:1px solid #f2f0ea;align-items:baseline}
.testzeile:last-child{border-bottom:0}
.testzeile .st{width:15px;flex-shrink:0;font-weight:700}
.testzeile .nm{flex:1}
.testzeile .vl{font-variant-numeric:tabular-nums;color:var(--grau);font-size:11.5px}
.testzeile.rot{background:var(--rot-hell)}

.tab{display:none} .tab.aktiv{display:block}
.zweispalten{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.zweispalten{grid-template-columns:1fr}}
.fussnote{font-size:11.5px;color:var(--grau-hell);margin-top:20px;text-align:center;line-height:1.6}

/* =============================================================================
   Druckansicht – Formulare A bis F
   ============================================================================= */
#druck{display:none}
@media print{
  @page{size:A4 portrait;margin:12mm 10mm}
  header,nav,.kopfleiste,.bilanzleiste,main,.overlay{display:none!important}
  body{background:#fff;font-size:9.5pt;color:#000}
  #druck{display:block}
  #druck h1{font-size:15pt;border-bottom:2.5pt solid #000;padding-bottom:4pt;margin-bottom:6pt}
  #druck h2{font-size:11pt;margin:11pt 0 3pt;border-bottom:1pt solid #000;padding-bottom:1.5pt;page-break-after:avoid}
  #druck table{font-size:8.5pt;page-break-inside:avoid;width:100%;border-collapse:collapse;margin-bottom:3pt}
  #druck th{font-size:7.5pt;color:#000;border-bottom:1pt solid #000;padding:2pt 4pt;text-transform:uppercase}
  #druck td{padding:1.8pt 4pt;border-bottom:.4pt solid #bbb}
  #druck tr.summe td{background:#eee;border-top:1pt solid #000;font-weight:700;border-bottom:0}
  #druck tr.gruppe td{background:#f6f6f6;font-weight:700;font-size:7.5pt;text-transform:uppercase}
  #druck .kopfzeile{display:flex;justify-content:space-between;font-size:8.5pt;margin:3pt 0;gap:12pt}
  #druck .erlaeuterung{font-size:8pt;margin:2pt 0 5pt;line-height:1.45}
  #druck .schluss{border:1.2pt solid #000;padding:5pt 7pt;margin-top:5pt;font-size:10pt}
  #druck .unterschrift{margin-top:26pt;display:flex;gap:40pt;font-size:8.5pt;page-break-inside:avoid}
  #druck .unterschrift div{border-top:.8pt solid #000;padding-top:3pt;flex:1}
  #druck .fuss{margin-top:12pt;font-size:7.5pt;color:#444;border-top:.4pt solid #999;padding-top:4pt;line-height:1.5}
  .seitenumbruch{page-break-before:always}
}
</style>
</head>
<body>

<header>
  <div class="marke">
    <h1>Nährstoffbilanz</h1>
    <div class="sub" id="kopfinfo">Referenzmethode Suisse-Bilanz</div>
  </div>
  <div class="spacer"></div>
  <div class="werkzeuge">
    <button class="knopf" onclick="sbSpeichern()" title="Alle Eingaben als Datei sichern">Speichern</button>
    <label class="knopf" title="Gesicherte Datei einlesen">Laden<input type="file" accept=".json,application/json" onchange="sbLaden(event)"></label>
    <button class="knopf" onclick="sbVorlage()" title="Betriebsvorlage laden">Vorlage</button>
    <button class="knopf" onclick="sbNeu()" title="Leere Bilanz beginnen">Neu</button>
    <button class="knopf stark" onclick="sbDrucken()">PDF</button>
  </div>
</header>

<div class="kopfleiste">
  <div class="bilanzleiste" id="bilanzleiste"></div>
  <nav id="nav"></nav>
</div>
<main id="inhalt"></main>

<div id="dialogbereich"></div>
<div id="druck"></div>

<script>/* ===== src/daten.js ===== */
/* =============================================================================
   Nährstoffbilanz – Referenzdaten
   Quelle: Wegleitung Suisse-Bilanz, Version 1.20 (Dezember 2025, gültig 2026/2027)
           Tab. 1 (Tiere), Tab. 2a–2e (Korrekturen), Tab. 3 (Wiesen/Weiden),
           Tab. 4 (Ackerkulturen), Tab. 5 (Gemüse), Tab. 6 (Dauerkulturen)
   Version 1.19 wird nur über gezielte Abweichungen (V119) abgebildet – zum
   Gegenrechnen bestehender Bilanzen.

   WICHTIG: Diese Datei enthält ausschliesslich Zahlenwerte der Referenzmethode,

(function (root) {

  /* ---------------------------------------------------------------------------

     einheit = "St" Stück | "Pl" Platz | "100Pl" | "100St" | "Einh"

     --------------------------------------------------------------------------- */
  var TIERE = [
    // ---- Rindvieh ----
    { id: "milchkuh", label: "Milchkuh (Ø 7'500 kg Jahresmilch)", gruppe: "Rindvieh", einheit: "St", gf: 56, n: 112, nges: 95.20, ngesLSR: 89.60, p: 39, k: 172, mg: 14, raufutter: true, korr: { typ: "milchkuh" } },
    { id: "ausmastkuh", label: "Ausmastkuh", gruppe: "Rindvieh", einheit: "Pl", gf: 53.2, n: 93.5, nges: 79.48, ngesLSR: 74.80, p: 30, k: 155, mg: 10.8, raufutter: true, spezial: true },
    { id: "galtkuh", label: "Galtkuh", gruppe: "Rindvieh", einheit: "Pl", gf: 40.6, n: 80.5, nges: 68.43, ngesLSR: 64.40, p: 28.7, k: 128.8, mg: 8.4, raufutter: true, spezial: true },
    { id: "mutterkuh_s", label: "Mutterkuh schwer (> 700 kg LG, ohne Kalb)", gruppe: "Rindvieh", einheit: "St", gf: 50, n: 95, nges: 76.00, p: 31, k: 158, mg: 10, raufutter: true },
    { id: "mutterkuh_m", label: "Mutterkuh mittel (600–700 kg LG, ohne Kalb)", gruppe: "Rindvieh", einheit: "St", gf: 45, n: 85, nges: 68.00, p: 28, k: 141, mg: 9, raufutter: true },
    { id: "mutterkuh_l", label: "Mutterkuh leicht (bis 600 kg LG, ohne Kalb)", gruppe: "Rindvieh", einheit: "St", gf: 38, n: 72, nges: 57.60, p: 24, k: 118, mg: 8, raufutter: true },
    { id: "jungvieh_160", label: "Jungvieh bis 160 Tage", gruppe: "Rindvieh", einheit: "Pl", gf: 6, n: 23, nges: 19.55, ngesLSR: 18.40, p: 5, k: 22.9, mg: 1.3, raufutter: true },
    { id: "jungvieh_160_365", label: "Jungvieh 160–365 Tage", gruppe: "Rindvieh", einheit: "Pl", gf: 20.2, n: 31, nges: 26.35, ngesLSR: 24.80, p: 12, k: 51.9, mg: 6.1, raufutter: true },
    { id: "jungvieh_12", label: "Jungvieh 1–2-jährig", gruppe: "Rindvieh", einheit: "Pl", gf: 26, n: 42.5, nges: 36.13, ngesLSR: 34.00, p: 14, k: 62.5, mg: 5.5, raufutter: true },
    { id: "jungvieh_2p", label: "Jungvieh über 2-jährig", gruppe: "Rindvieh", einheit: "Pl", gf: 33, n: 55, nges: 46.75, ngesLSR: 44.00, p: 20, k: 75, mg: 7, raufutter: true },
    { id: "mastkalb", label: "Mastkälberplatz (60–220 kg)", gruppe: "Rindvieh", einheit: "Pl", gf: 1.0, n: 18.8, nges: 15.04, p: 6.7, k: 13.3, mg: 0.9, raufutter: true },
    { id: "mkkalb_160", label: "Mutterkuhkalb bis 160 d", gruppe: "Rindvieh", einheit: "Pl", gf: 2.8, n: 21.5, nges: 17.20, p: 7.5, k: 18.1, mg: 0.9, raufutter: true },

      r.dtTS = flaeche * ertrag;

      r.nProHa = flaeche > 0 ? r.n / flaeche : 0;
      return r;
    }

    if (ref.modus === "acker") {
      r.dtTS = flaeche * ertrag;
      var nHa = ref.n;
      if (ref.korr && ertragKorrekturAktiv) {
        /* Kap. 3.7: ertragsabhängige N-Korrektur, Ertrag gedeckelt am Maximalertrag */
        var e = Math.min(ertrag, ref.korr.max);
        nHa = ref.n + (e - ref.korr.std) * ref.korr.kf;
        if (nHa !== ref.n) {
          r.korrekturHinweis = "N " + ref.n + " → " + Math.round(nHa * 10) / 10 +
            " kg/ha (Ertrag " + ertrag + " vs. Standard " + ref.korr.std + " dt/ha)";
        }
        if (ertrag > ref.korr.max) {
          r.korrekturHinweis += " · Ertrag für die Korrektur auf " + ref.korr.max + " dt/ha begrenzt";
        }
      } else if (!ref.korr && ref.ertragStd > 0 && ertrag > 0) {
        /* Übrige Ackerkulturen: N-Reduktion erst ab 20 % unter dem Standardertrag */
        var verh = ertrag / ref.ertragStd;
        if (verh < K.UEBRIGE_ACKER_REDUKTION) {
          nHa = ref.n * verh;
          r.korrekturHinweis = "N " + ref.n + " → " + Math.round(nHa * 10) / 10 +
            " kg/ha (Ertrag " + Math.round((1 - verh) * 100) + " % unter Standard)";
        }
      }
      nHa = pos(nHa);
      r.n = flaeche * nHa;
      r.p = r.dtTS * ref.p; r.k = r.dtTS * ref.k; r.mg = r.dtTS * ref.mg;
      r.nProHa = nHa;
      return r;
    }

    /* modus "flach": alle Werte in kg/ha */
    r.n = flaeche * ref.n; r.p = flaeche * ref.p; r.k = flaeche * ref.k; r.mg = flaeche * ref.mg;
    r.nProHa = ref.n;
    r.dtTS = ref.ertragStd ? flaeche * ref.ertragStd : 0;
    return r;
  }

  /* ===========================================================================
     HAUPTBERECHNUNG – 11 Schritte der Wegleitung
     =========================================================================== */
  function berechne(state) {
    var meld = Meldungen();
    var s = state, ver = s.version || "1.20";
    var b = s.betrieb || {};
    var hoehenlage = b.hoehenlage || "h600";

    /* ---- Flächenbasis ---------------------------------------------------- */
    var ln = num(b.ln), bauzone = num(b.bauzone), df = num(b.df);
    var gesamtflaecheC = ln + bauzone;   // "Gesamtfläche C" = LN + Flächen in der Bauzone
    var oaEingabe = num(b.oa);
    var oaProz = gesamtflaecheC > 0 ? 100 * oaEingabe / gesamtflaecheC : 0;

    /* =====================================================================
       SCHRITT 1 – Tierbestand und Grundfutterverzehr (Formular A1)
       ===================================================================== */
    var A1 = { gf: 0, n: 0, nges: 0, p: 0, k: 0, mg: 0 };
    var laufhofN = 0, weideN = 0, V1 = 0;
    var tierRows = [];

    (s.tiere || []).forEach(function (z, i) {
      var w = tierWerte(z, meld);
      if (!w) { meld.fehler("tiere", "Zeile " + (i + 1) + ": unbekannte Tierkategorie."); return; }
      var anz = num(z.anzahl);
      if (anz < 0) meld.info("tiere", w.label + ": negative Anzahl wird als Abzug (z. B. Sömmerung) gerechnet.");

      var gf = anz * w.gf, nges = anz * w.nges, p = anz * w.p, kk = anz * w.k, mg = anz * w.mg, nBr = anz * w.n;

      /* --- Laufhof (Kap. 3.5): 1/10 des Nges eines Laufhoftages --- */
      var laufhofTage = num(z.laufhofTage);
      var weideTage = num(z.weideTage), weideStd = num(z.weideStd);
      var laufhofEffektiv = laufhofTage;

      if (w.laufhofMax && laufhofEffektiv > w.laufhofMax) {
        laufhofEffektiv = w.laufhofMax;
        meld.warnung("tiere", w.label + ": Laufhoftage auf " + w.laufhofMax + " begrenzt (Wegleitung Kap. 3.5).");
      }
      /* An Weidetagen mit > 12 h kein zusätzlicher Laufhofabzug */
      if (weideStd > K.WEIDE_STD_MAX_LAUFHOF && weideTage > 0 && laufhofEffektiv > 0) {
        var vorher = laufhofEffektiv;
        laufhofEffektiv = pos(laufhofEffektiv - weideTage);
        if (laufhofEffektiv !== vorher) {
          meld.warnung("tiere", w.label + ": Weide > 12 h/Tag – Laufhoftage von " + vorher + " auf " +
            Math.round(laufhofEffektiv) + " reduziert (kein doppelter Abzug, Ziff. 2.11).");
        }
      }
      var lh = anz * laufhofEffektiv * w.nges * K.LAUFHOF_ANTEIL / 365;

      /* --- Weide (Kap. 3.5) --- */
      var wd = 0;
      if (weideTage > 0 && weideStd > 0) {
        if (w.gefluegel) {
          meld.warnung("tiere", w.label + ": Für Geflügel ist kein Weideabzug zulässig – Angabe ignoriert (Kap. 3.5).");
        } else if (!w.raufutter && !(w.freiland && z.freiland)) {
          meld.warnung("tiere", w.label + ": Weideabzug nur für Raufutterverzehrer und anerkannte Freilandschweine – Angabe ignoriert.");
        } else {
          wd = anz * weideStd * weideTage * w.nges / (24 * 365);
        }
      }
      if (weideStd > 24) meld.fehler("tiere", w.label + ": Weidestunden pro Tag können nicht über 24 liegen.");
      if (weideTage > 365) meld.fehler("tiere", w.label + ": Weidetage können nicht über 365 liegen.");
      if (laufhofTage > 365) meld.fehler("tiere", w.label + ": Laufhoftage können nicht über 365 liegen.");

      /* --- Vollmist (Kap. 3.5): nur der effektiv im Stall anfallende Nges --- */
      var typ = num(z.vollmist);
      var stallNges = nges - lh - wd;
      var vm = pos(stallNges) * (typ / 100);

      A1.gf += gf; A1.n += nBr; A1.nges += nges; A1.p += p; A1.k += kk; A1.mg += mg;
      laufhofN += lh; weideN += wd; V1 += vm;

      tierRows.push({
        idx: i, label: w.label, gruppe: w.gruppe, einheit: w.einheit, anzahl: anz,
        gfProEinheit: w.gf, ngesProEinheit: w.nges, pProEinheit: w.p,
        gf: gf, n: nBr, nges: nges, p: p, k: kk, mg: mg,
        laufhof: lh, weide: wd, vollmist: vm, vollmistTyp: typ,
        laufhofEffektiv: laufhofEffektiv, hinweise: w.hinweise,
        kfStandard: w.kfStandard, gfMilchkorrigiert: w.gfMilchkorrigiert, gfKfKorrektur: w.gfKfKorrektur,
        ueberschrieben: w.ueberschrieben
      });
    });

    /* =====================================================================
       SCHRITT 2 – Zu-/Wegfuhr Grundfutter, zu produzierendes GF (Formular B)
       ===================================================================== */
    var gfWeg = 0, gfZu = 0, gfAusser = 0, gfArmZufuhr = 0;
    var gfRows = [];
    (s.grundfutter || []).forEach(function (g, i) {
      var fs = num(g.menge), tsProz = num(g.tsProzent);
      if (tsProz < 0 || tsProz > 100) meld.fehler("grundfutter", (g.name || "Position " + (i + 1)) + ": TS-Gehalt muss zwischen 0 und 100 % liegen.");
      var ts = fs * tsProz / 100;
      if (g.art === "wegfuhr") gfWeg += ts;
      else if (g.art === "ausserFF") gfAusser += ts;
      else { gfZu += ts; if (g.arm) gfArmZufuhr += ts; }
      gfRows.push({ idx: i, name: g.name, art: g.art, menge: fs, tsProzent: tsProz, ts: ts, arm: !!g.arm });
    });

    var hatTiere = A1.gf > 0 || (s.tiere || []).length > 0;
    var lagerMax = hatTiere ? K.GF_LAGERVERLUST : K.GF_LAGERVERLUST_VIEHLOS;
    var gfVerlust = num(s.gfVerlust), gfFehler = num(s.gfFehler);
    if (gfVerlust > lagerMax) meld.warnung("grundfutter", "Lagerungs-/Krippenverluste " + gfVerlust + " % überschreiten das Maximum von " + lagerMax + " %" + (hatTiere ? "" : " (viehloser Betrieb, keine Krippenverluste)") + ".");
    if (gfFehler > K.GF_FEHLERBEREICH) meld.warnung("grundfutter", "Fehlerbereich " + gfFehler + " % überschreitet das Maximum von " + K.GF_FEHLERBEREICH + " %.");

    var nettoGF = A1.gf + gfWeg - gfZu - gfAusser;
    var gfProd = nettoGF * (1 + gfVerlust / 100 + gfFehler / 100);
    if (gfProd < 0) {
      meld.warnung("grundfutter", "Rechnerisch ist kein Grundfutter zu produzieren (Zufuhr übersteigt den Verzehr). Bitte Zu-/Wegfuhren prüfen.");
      gfProd = Math.max(gfProd, nettoGF * 1);
    }

    /* =====================================================================
       SCHRITT 3+4 – Kulturen, Flächen, Ertragsniveau, nährstoffarmes GF
       ===================================================================== */
    var kultVorlauf = [];
    (s.kulturen || []).forEach(function (z, i) {
      var ref = kulturRef(z, ver);
      if (!ref) { meld.fehler("kulturen", "Zeile " + (i + 1) + ": unbekannte Kultur."); return; }
      var fl = num(z.flaeche);
      if (fl < 0) meld.fehler("kulturen", ref.label + ": negative Fläche ist nicht zulässig.");
      var ertragStd = standardErtrag(ref, hoehenlage);
      var ertrag = (z.ertrag === "" || z.ertrag === undefined || z.ertrag === null) ? ertragStd : num(z.ertrag);
      if (ref.ertragFix) ertrag = ref.ertragStd;
      kultVorlauf.push({ idx: i, zeile: z, ref: ref, flaeche: fl, ertrag: ertrag, ertragStd: ertragStd, saldo: z.ertragModus === "saldo" });
    });

    /* Ertragsniveau der intensiven Wiesen als Restgrösse aus der GF-Bilanz (Kap. 3.4) */
    var saldoZeilen = kultVorlauf.filter(function (r) { return r.saldo && r.ref.istGF; });
    var saldoErtrag = null, saldoFlaeche = 0, gfAndereTS = 0;
    if (saldoZeilen.length) {
      kultVorlauf.forEach(function (r) {
        if (r.ref.istGF && !r.saldo) gfAndereTS += r.flaeche * r.ertrag;
      });
      saldoFlaeche = saldoZeilen.reduce(function (a, r) { return a + r.flaeche; }, 0);
      if (saldoFlaeche > 0) {
        saldoErtrag = (gfProd - gfAndereTS) / saldoFlaeche;
        if (saldoErtrag < 0) {
          meld.warnung("kulturen", "Die Grundfutterbilanz ergibt für die Saldo-Kulturen einen negativen Ertrag. Zu-/Wegfuhren und übrige Erträge prüfen.");
          saldoErtrag = 0;
        }
        saldoZeilen.forEach(function (r) {
          r.ertrag = saldoErtrag;
          var mx = maxErtrag(r.ref, hoehenlage);
          if (mx && saldoErtrag > mx) {
            meld.warnung("kulturen", r.ref.label + ": errechneter Ertrag " + Math.round(saldoErtrag) +
              " dt TS/ha übersteigt den Maximalertrag von " + mx + " dt TS/ha der Höhenlage (Ertragsschätzung nötig, Ziff. 2.10).");
          }
        });
      }
    }

    /* Nährstoffbedarf, Flächensummen, nährstoffarmes GF, Transfer-Basis */
    var C = { n: 0, p: 0, k: 0, mg: 0 };
    var C1 = { n: 0, p: 0, k: 0, mg: 0, flaeche: 0 };
    var C2 = { n: 0, p: 0, k: 0, mg: 0, flaeche: 0 };
    var C3 = { n: 0, p: 0, k: 0, mg: 0, flaeche: 0 };
    var CB = { n: 0, p: 0, k: 0, mg: 0, flaeche: 0 };
    var flaecheTotal = 0, oaBerechnet = 0, gfArmEigen = 0, gfT = 0, gfKulturenTS = 0;
    var kultRows = [];

    kultVorlauf.forEach(function (r) {
      var ref = r.ref, fl = r.flaeche, ertrag = r.ertrag;
      var ertragKorrAktiv = r.zeile.ertragKorrektur !== false && !!ref.korr;
      var bed = kulturBedarf(ref, fl, ertrag, ertragKorrAktiv, meld);

      /* Plausibilität Ertrag */
      var mx = maxErtrag(ref, hoehenlage);
      if (mx && ertrag > mx && !r.saldo) {
        meld.warnung("kulturen", ref.label + ": Ertrag " + ertrag + " dt TS/ha übersteigt den Maximalwert " + mx +
          " dt TS/ha der Höhenlage – nur mit Ertragsschätzung zulässig (Ziff. 2.10).");
      }

      C.n += bed.n; C.p += bed.p; C.k += bed.k; C.mg += bed.mg;
      if (!ref.ohneFlaeche) { flaecheTotal += fl; if (ref.oa) oaBerechnet += fl; }

      var ziel = ref.bereich === "futterbau" ? C1 : ref.bereich === "ackerbau" ? C2 : ref.bereich === "spezial" ? C3 : CB;
      ziel.n += bed.n; ziel.p += bed.p; ziel.k += bed.k; ziel.mg += bed.mg;
      if (!ref.ohneFlaeche) ziel.flaeche += fl;

      if (ref.istGF) {
        gfKulturenTS += bed.dtTS;
        if (ref.gfArm) gfArmEigen += bed.dtTS;
        if (ref.gfUnged) gfT += bed.dtTS;
      }

      kultRows.push({
        idx: r.idx, id: ref.id, label: ref.label, gruppe: ref.gruppe, bereich: ref.bereich, modus: ref.modus,
        flaeche: fl, ertrag: ertrag, ertragStd: r.ertragStd, ertragRef: ref.ertragRef, ertragFix: !!ref.ertragFix,
        ertragMax: mx, saldo: r.saldo, dtTS: bed.dtTS,
        n: bed.n, p: bed.p, k: bed.k, mg: bed.mg, nProHa: bed.nProHa,
        korrekturHinweis: bed.korrekturHinweis, hatKorrektur: !!ref.korr,
        ertragKorrAktiv: ertragKorrAktiv, istGF: !!ref.istGF, gfArm: !!ref.gfArm,
        gfUnged: !!ref.gfUnged, oa: !!ref.oa, ohneFlaeche: !!ref.ohneFlaeche,
        eigen: !!r.zeile.eigen, override: r.zeile.override
      });
    });

    /* Flächenkontrolle (Kap. 3.3) */
    if (gesamtflaecheC > 0 && Math.abs(flaecheTotal - gesamtflaecheC) > 0.05) {
      meld.warnung("kulturen", "Erfasste Kulturfläche " + flaecheTotal.toFixed(2) + " ha weicht von LN + Bauzone (" +
        gesamtflaecheC.toFixed(2) + " ha) ab – Differenz " + (flaecheTotal - gesamtflaecheC).toFixed(2) + " ha.");
    }
    if (oaEingabe > 0 && Math.abs(oaBerechnet - oaEingabe) > 0.05) {
      meld.info("betrieb", "Offene Ackerfläche: erfasst " + oaEingabe.toFixed(2) + " ha, aus den Kulturen errechnet " +
        oaBerechnet.toFixed(2) + " ha. Massgebend ist die Betriebsdatenerhebung.");
    }
    if (df > ln + bauzone && ln > 0) meld.warnung("betrieb", "Die düngbare Fläche ist grösser als LN + Bauzone.");

    /* Grundfutter-Deckungskontrolle */
    if (gfProd > 0 && gfKulturenTS > 0) {
      var abwGF = gfKulturenTS - gfProd;
      if (Math.abs(abwGF) > 0.10 * gfProd) {
        meld.warnung("grundfutter", "Grundfutterbilanz nicht ausgeglichen: Kulturen liefern " + Math.round(gfKulturenTS) +
          " dt TS, zu produzieren wären " + Math.round(gfProd) + " dt TS (Differenz " +
          (abwGF > 0 ? "+" : "") + Math.round(abwGF) + " dt TS).");
      }
    }

    /* =====================================================================
       SCHRITT 5 – Abzüge → A2 (Formular A2)
       ===================================================================== */
    var gfArm = gfArmEigen + gfArmZufuhr;
    var abzArmN = gfArm * K.ARM_N;
    var abzArmP = gfArm * K.ARM_P;
    var abzLaufhof = K.LAUFHOF_ABZUG * laufhofN;
    var abzWeide = K.WEIDE_ABZUG * weideN;

    var A2 = {
      nges: pos(A1.nges - abzArmN - abzLaufhof - abzWeide),
      p: pos(A1.p - abzArmP),
      k: A1.k, mg: A1.mg
    };
    if (A1.nges - abzArmN - abzLaufhof - abzWeide < 0) meld.info("tiere", "Der N-Anfall nach Abzügen wäre negativ und wurde auf 0 gesetzt (Kap. 3.5).");
    if (A1.p - abzArmP < 0) meld.info("tiere", "Der P₂O₅-Anfall nach Abzügen wäre negativ und wurde auf 0 gesetzt (Kap. 3.5).");

    /* =====================================================================
       SCHRITT 6 – Zu-/Wegfuhr unvergärte Hofdünger (Formular A3), Vollmist
       ===================================================================== */
    var A3 = { nges: 0, p: 0 }, V2 = 0;
    var hofdRows = [];
    (s.hofduenger || []).forEach(function (h, i) {
      var vz = h.richtung === "wegfuhr" ? -1 : 1;
      var nges = vz * Math.abs(num(h.nges)), p = vz * Math.abs(num(h.p));
      A3.nges += nges; A3.p += p;
      if (h.vollmist) V2 += nges;
      hofdRows.push({ idx: i, name: h.name, richtung: h.richtung, nges: nges, p: p, vollmist: !!h.vollmist });
    });

    if (A1.nges + A3.nges < 0) {
      meld.warnung("duenger", "Die Summe aus A1 und A3 ist negativ und wird auf 0 gesetzt (Kap. 3.6): es kann nicht mehr weggeführt werden als anfällt.");
    }
    var basisVollmist = pos(A1.nges + A3.nges);
    if (V1 + V2 > basisVollmist && basisVollmist > 0) {
      meld.warnung("duenger", "Es wird mehr Vollmist deklariert als insgesamt Nges anfällt – Anteil auf 100 % begrenzt.");
    }
    var vollmistProz = basisVollmist > 0 ? clamp(100 * (V1 + V2) / basisVollmist, 0, 100) : 0;

    /* =====================================================================
       SCHRITT 4 (Fortsetzung) – innerbetrieblicher Nährstofftransfer T
       ===================================================================== */
    var transferBasis = Math.min(gfT, gfProd * K.TRANSFER_MAX_ANTEIL);
    var T = pos(K.TRANSFER_PRO_DT * transferBasis);

    /* =====================================================================
       SCHRITT 8 – Zufuhr übriger Dünger (Formular D)
       ===================================================================== */
    var Dg = { nverf: 0, p: 0 };
    var duengRows = [];
    (s.duenger || []).forEach(function (d, i) {
      var nverf = num(d.nverf), p = num(d.p);
      if (d.typ === "kompost" && d.nges !== undefined && d.nges !== null && d.nges !== "") {
        nverf = num(d.nges) * K.KOMPOST_NVERF;   // Kompost: 10 % des Nges als Nverf
      }
      Dg.nverf += nverf; Dg.p += p;
      duengRows.push({ idx: i, name: d.name, typ: d.typ, nges: num(d.nges), nverf: nverf, p: p });
    });
    /* Emissionsmindernde Ausbringung: 6 kg Nverf je ha (Kap. 3.8) */
    var schleppHa = num(s.schleppschlauchHa);
    var schleppN = schleppHa * K.SCHLEPPSCHLAUCH_N;
    Dg.nverf += schleppN;

    /* =====================================================================
       SCHRITT 9 – Vergärungsprodukte, Ernterückstände Gemüse (Formular E)
       ===================================================================== */
    var ausnutzVerg = pos(K.VERG_BASIS - K.VERG_OA * oaProz) / 100;
    var E = { nverf: 0, p: 0 };
    var vergRows = [];
    (s.vergaerung || []).forEach(function (v, i) {
      var vz = v.richtung === "wegfuhr" ? -1 : 1;
      var nges = 0, nverf = 0, p = 0, faktor = null;
      if (v.typ === "ernterueckstaende") {
        var t = Math.abs(num(v.menge));
        nges = vz * t * D.ERNTERUECKSTAENDE.nges;
        p = vz * t * D.ERNTERUECKSTAENDE.p;
        faktor = ausnutzVerg;
        nverf = (v.nverf !== undefined && v.nverf !== null && v.nverf !== "") ? vz * Math.abs(num(v.nverf)) : nges * faktor;
      } else {
        nges = vz * Math.abs(num(v.nges));
        p = vz * Math.abs(num(v.p));
        if (v.typ === "fluessig") { faktor = ausnutzVerg; nverf = nges * faktor; }
        else if (v.typ === "fest") { faktor = K.VERG_FEST; nverf = nges * faktor; }
        else { nverf = vz * Math.abs(num(v.nverf)); faktor = nges !== 0 ? nverf / nges : null; }
      }
      E.nverf += nverf; E.p += p;
      vergRows.push({ idx: i, name: v.name, typ: v.typ, richtung: v.richtung, menge: num(v.menge), nges: nges, nverf: nverf, p: p, faktor: faktor });
    });

    /* =====================================================================
       SCHRITT 10 – Betriebsspezifischer N-Ausnutzungsgrad (Formular F)
       ===================================================================== */
    var abzugOA = K.AUSNUTZUNG_OA * oaProz;
    var abzugVM = K.AUSNUTZUNG_VOLLMIST * vollmistProz;
    var ausnutzProz = pos(K.AUSNUTZUNG_BASIS - abzugOA - abzugVM);
    var ausnutz = ausnutzProz / 100;

    /* =====================================================================
       SCHRITT 11 – Gesamtbilanz (Formular F)
       ===================================================================== */
    var A2verf = A2.nges * ausnutz;
    var A3verf = A3.nges * ausnutz;
    var bilN = A2verf - C.n + A3verf + Dg.nverf + E.nverf;
    var bilP = A2.p - C.p + A3.p + Dg.p + E.p - T;

    var eigenN = C.n > 0 ? 100 * A2verf / C.n : 0;
    var eigenP = C.p > 0 ? 100 * A2.p / C.p : 0;

    var zufuhrN = A2verf + A3verf + Dg.nverf + E.nverf;
    var zufuhrP = A2.p + A3.p + Dg.p + E.p - T;

    return {
      version: ver, hoehenlage: hoehenlage,
      ln: ln, bauzone: bauzone, df: df, gesamtflaecheC: gesamtflaecheC,
      oa: oaEingabe, oaProz: oaProz, oaBerechnet: oaBerechnet,

      tierRows: tierRows, A1: A1, laufhofN: laufhofN, weideN: weideN, V1: V1,

    sKomma.betrieb.ln = 10; sKomma.kulturen = [{ kultur: "wweizen", flaeche: "2,5", ertrag: "60" }];
    t(GI, "Dezimalkomma wird korrekt gelesen", E.berechne(sKomma).C.n, 2.5 * 140, 0.01);

    /* A2 darf nie negativ werden */
    var sNeg = V.leer();
    sNeg.betrieb.ln = 50;
    sNeg.tiere = [{ tier: "mutterkuh_m", anzahl: 10, laufhofTage: 365, weideTage: 365, weideStd: 24, vollmist: 0 }];
    sNeg.kulturen = [{ kultur: "wi_ext", flaeche: 50, ertrag: 30 }];
    var rNeg = E.berechne(sNeg);
    tBool(GI, "A2 Nges wird nie negativ", rNeg.A2.nges >= 0, "≥ 0");
    tBool(GI, "A2 P₂O₅ wird nie negativ", rNeg.A2.p >= 0, "≥ 0");

    /* Vollmistanteil immer zwischen 0 und 100 % – auch wenn rechnerisch mehr
       Vollmist deklariert wird als insgesamt Nges anfällt (Kap. 3.6). */
    var sVM = V.leer(); sVM.betrieb.ln = 20;
    sVM.tiere = [{ tier: "mutterkuh_m", anzahl: 10, vollmist: 100 }];   // A1 = 680, V1 = 680
    sVM.hofduenger = [
      { name: "Vollmist-Zufuhr", richtung: "zufuhr", nges: 5000, p: 100, vollmist: true },
      { name: "Gülle-Wegfuhr", richtung: "wegfuhr", nges: 4800, p: 80, vollmist: false }
    ];
    var rVM = E.berechne(sVM);   // V1+V2 = 5680 gegenüber Basis A1+A3 = 880 → muss gekappt werden
    tBool(GI, "Vollmistanteil bleibt zwischen 0 und 100 %", rVM.vollmistProz >= 0 && rVM.vollmistProz <= 100, "0–100 %");
    t(GI, "Übermässiger Vollmist wird auf 100 % gekappt", rVM.vollmistProz, 100, 0.001);
    /* Negativer Vollmistsaldo darf nicht unter 0 % fallen */
    var sVMn = V.leer(); sVMn.betrieb.ln = 20;
    sVMn.tiere = [{ tier: "mutterkuh_m", anzahl: 10, vollmist: 0 }];
    sVMn.hofduenger = [{ name: "Vollmist-Wegfuhr", richtung: "wegfuhr", nges: 300, p: 50, vollmist: true }];
    t(GI, "Negativer Vollmistsaldo wird auf 0 % gekappt", E.berechne(sVMn).vollmistProz, 0, 0.001);

    /* Laufhofabzug: exakt 50 % des im Laufhof anfallenden Nges (Kap. 3.5) */
    var sLH = V.leer(); sLH.betrieb.ln = 50;
    sLH.tiere = [{ tier: "mutterkuh_m", anzahl: 100, laufhofTage: 365, weideTage: 0, weideStd: 0, vollmist: 0 }];
    var rLH = E.berechne(sLH);
    t(GI, "Laufhof-Nges bei ganzjähriger Laufhofhaltung", rLH.laufhofN, 100 * 68 * 0.1, 0.01);
    t(GI, "Laufhofabzug beträgt 50 % des Laufhof-Nges", rLH.abzLaufhof, 0.5 * rLH.laufhofN, 0.001);
    t(GI, "A2 nach Laufhofabzug (100 Mutterkühe, 365 Tage)", rLH.A2.nges, 6800 - 340, 0.01);

    /* Weideabzug: exakt 70 % des auf der Weide anfallenden Nges (Kap. 3.5) */
    var sWE = V.leer(); sWE.betrieb.ln = 50;
    sWE.tiere = [{ tier: "mutterkuh_m", anzahl: 100, laufhofTage: 0, weideTage: 365, weideStd: 12, vollmist: 0 }];
    var rWE = E.berechne(sWE);
    t(GI, "Weide-Nges bei ganzjähriger Weide à 12 h", rWE.weideN, 100 * 68 * 12 / 24, 0.01);
    t(GI, "Weideabzug beträgt 70 % des Weide-Nges", rWE.abzWeide, 0.7 * rWE.weideN, 0.001);
    t(GI, "A2 nach Weideabzug (100 Mutterkühe, 365 Tage à 12 h)", rWE.A2.nges, 6800 - 0.7 * 3400, 0.01);

    /* Ausnutzungsgrad nie negativ (extreme OA + Vollmist) */
    var sAus = V.leer(); sAus.betrieb.ln = 100; sAus.betrieb.oa = 100;
    sAus.tiere = [{ tier: "mutterkuh_m", anzahl: 50, vollmist: 100 }];
    var rAus = E.berechne(sAus);
    tBool(GI, "N-Ausnutzungsgrad bleibt ≥ 0", rAus.ausnutzProz >= 0, "≥ 0");
    t(GI, "N-Ausnutzungsgrad bei 100 % OA und 100 % Vollmist", rAus.ausnutzProz, 60 - 15 - 12, 0.1);

    /* Wegfuhr Hofdünger reduziert A3 korrekt (Vorzeichen) */
    var sWeg = V.leer(); sWeg.betrieb.ln = 10;
    sWeg.hofduenger = [
      { name: "Zufuhr", richtung: "zufuhr", nges: 1000, p: 500, vollmist: false },
      { name: "Wegfuhr", richtung: "wegfuhr", nges: 400, p: 200, vollmist: false }
    ];
    var rWeg = E.berechne(sWeg);
    t(GI, "Hofdünger-Saldo Nges (1'000 zu, 400 weg)", rWeg.A3.nges, 600, 0.01);
    t(GI, "Hofdünger-Saldo P₂O₅ (500 zu, 200 weg)", rWeg.A3.p, 300, 0.01);
    /* Wegfuhr wird auch dann als Abzug gerechnet, wenn der Betrag positiv eingegeben wird */
    var sWeg2 = V.leer(); sWeg2.betrieb.ln = 10;
    sWeg2.hofduenger = [{ name: "Wegfuhr", richtung: "wegfuhr", nges: -400, p: -200, vollmist: false }];
    t(GI, "Wegfuhr mit negativer Eingabe bleibt Wegfuhr", E.berechne(sWeg2).A3.nges, -400, 0.01);

    /* Grundfutter: Wegfuhr erhöht, Zufuhr senkt das zu produzierende GF */
    var sGF = V.leer(); sGF.betrieb.ln = 10;
    sGF.tiere = [{ tier: "mutterkuh_m", anzahl: 10, vollmist: 0 }];  // 450 dt TS
    sGF.gfVerlust = 0; sGF.gfFehler = 0;
    sGF.grundfutter = [
      { name: "Wegfuhr", art: "wegfuhr", menge: 100, tsProzent: 35 },
      { name: "Zufuhr", art: "zufuhr", menge: 100, tsProzent: 88 },
      { name: "Ausserhalb FF", art: "ausserFF", menge: 100, tsProzent: 30 }
    ];
    t(GI, "Netto-GF-Bedarf mit Zu-/Wegfuhr", E.berechne(sGF).nettoGF, 450 + 35 - 88 - 30, 0.01);
    /* Zuschläge Lager + Fehlerbereich */
    var sGF2 = JSON.parse(JSON.stringify(sGF));
    sGF2.gfVerlust = 5; sGF2.gfFehler = 5;
    t(GI, "GFprod mit 5 % Lager- und 5 % Fehlerzuschlag", E.berechne(sGF2).gfProd, (450 + 35 - 88 - 30) * 1.10, 0.01);

    /* Geflügel: kein Weideabzug */
    var sGefl = V.leer(); sGefl.betrieb.ln = 10;
    sGefl.tiere = [{ tier: "legehenne_band", anzahl: 10, weideTage: 200, weideStd: 8, laufhofTage: 100, vollmist: 100 }];
    var rGefl = E.berechne(sGefl);
    t(GI, "Geflügel: kein Weideabzug", rGefl.weideN, 0, 0.001);
    tBool(GI, "Geflügel: Laufhofabzug bleibt zulässig", rGefl.laufhofN > 0, "> 0");

    /* Weide > 12 h/Tag: kein zusätzlicher Laufhofabzug für dieselben Tage */
    var sW12 = V.leer(); sW12.betrieb.ln = 10;
    sW12.tiere = [{ tier: "mutterkuh_m", anzahl: 10, weideTage: 200, weideStd: 14, laufhofTage: 200, vollmist: 0 }];
    t(GI, "Weide > 12 h: Laufhoftage vollständig verrechnet", E.berechne(sW12).laufhofN, 0, 0.001);
    var sW10 = V.leer(); sW10.betrieb.ln = 10;
    sW10.tiere = [{ tier: "mutterkuh_m", anzahl: 10, weideTage: 200, weideStd: 10, laufhofTage: 200, vollmist: 0 }];
    tBool(GI, "Weide ≤ 12 h: Laufhofabzug bleibt bestehen", E.berechne(sW10).laufhofN > 0, "> 0");

    /* Mastpoulets: max. 180 Laufhoftage */
    var sMP = V.leer(); sMP.betrieb.ln = 10;
    sMP.tiere = [{ tier: "mastpoulet", anzahl: 10, laufhofTage: 365, vollmist: 100 }];
    var sMP180 = V.leer(); sMP180.betrieb.ln = 10;
    sMP180.tiere = [{ tier: "mastpoulet", anzahl: 10, laufhofTage: 180, vollmist: 100 }];
    t(GI, "Mastpoulets: Laufhoftage auf 180 begrenzt", E.berechne(sMP).laufhofN, E.berechne(sMP180).laufhofN, 0.001);

    /* Laufstall Rindvieh: Nges LSR statt Nges */
    var sLS = V.leer(); sLS.betrieb.ln = 10;
    sLS.tiere = [{ tier: "jungvieh_12", anzahl: 10, vollmist: 0, laufstall: true }];
    t(GI, "Laufstall Rindvieh nutzt Nges LSR", E.berechne(sLS).A1.nges, 10 * 34.00, 0.01);
    var sAB = V.leer(); sAB.betrieb.ln = 10;
    sAB.tiere = [{ tier: "jungvieh_12", anzahl: 10, vollmist: 0 }];
    t(GI, "Anbindehaltung nutzt Standard-Nges", E.berechne(sAB).A1.nges, 10 * 36.13, 0.01);

    /* Vollmist berücksichtigt nur den im Stall anfallenden Nges */
    var sVM2 = V.leer(); sVM2.betrieb.ln = 10;
    sVM2.tiere = [{ tier: "mutterkuh_l", anzahl: 15, laufhofTage: 185, weideTage: 180, weideStd: 12, vollmist: 100 }];
    var rVM2 = E.berechne(sVM2);
    t(GI, "Vollmist = Nges − Laufhof − Weide", rVM2.V1, rVM2.A1.nges - rVM2.laufhofN - rVM2.weideN, 0.01);
    /* Typ 50 = halber Stallanfall */
    var sVM50 = JSON.parse(JSON.stringify(sVM2)); sVM50.tiere[0].vollmist = 50;
    t(GI, "Vollmist Typ 50 = halber Stallanfall", E.berechne(sVM50).V1, rVM2.V1 / 2, 0.01);
    var sVM0 = JSON.parse(JSON.stringify(sVM2)); sVM0.tiere[0].vollmist = 0;
    t(GI, "Vollmist Typ 0 = kein Vollmist", E.berechne(sVM0).V1, 0, 0.001);

    /* Saldo-Ertrag: intensive Wiesen als Restgrösse aus der Grundfutterbilanz */
    var sSaldo = V.leer(); sSaldo.betrieb.ln = 30;
    sSaldo.tiere = [{ tier: "mutterkuh_m", anzahl: 10, vollmist: 0 }];   // 450 dt TS
    sSaldo.gfVerlust = 0; sSaldo.gfFehler = 0;
    sSaldo.kulturen = [
      { kultur: "wi_ext", flaeche: 5, ertrag: 20 },                       // 100 dt TS fix
      { kultur: "wi_int", flaeche: 10, ertragModus: "saldo" }             // Rest: 350 / 10 = 35
    ];
    var rSaldo = E.berechne(sSaldo);
    t(GI, "Saldo-Ertrag intensive Wiese", rSaldo.saldoErtrag, 35, 0.01);
    t(GI, "Saldo deckt die Grundfutterbilanz exakt", rSaldo.gfKulturenTS, rSaldo.gfProd, 0.01);

    /* Ungedüngte Flächen ohne Nährstoffbedarf liefern trotzdem Grundfutter
       und speisen den innerbetrieblichen P₂O₅-Transfer (Kap. 3.4). */
    var sUng = V.leer(); sUng.betrieb.ln = 30;
    sUng.tiere = [{ tier: "mutterkuh_m", anzahl: 40, vollmist: 0 }];   // 1'800 dt TS Verzehr → Deckel 450 greift nicht
    sUng.gfVerlust = 0; sUng.gfFehler = 0;
    sUng.kulturen = [{ kultur: "wiese_duengeverbot", flaeche: 10, ertrag: 25 }];
    var rUng = E.berechne(sUng);
    t(GI, "Wiese mit Düngeverbot liefert Grundfutter", rUng.gfKulturenTS, 250, 0.01);
    t(GI, "Wiese mit Düngeverbot hat keinen Nährstoffbedarf", rUng.C.n + rUng.C.p, 0, 0.001);
    t(GI, "Wiese mit Düngeverbot speist den P₂O₅-Transfer", rUng.T, 0.4 * 250, 0.01);
    t(GI, "Wiese mit Düngeverbot zählt als nährstoffarmes Grundfutter", rUng.gfArm, 250, 0.01);
    /* Bei kleinerem Grundfutterbedarf greift der Deckel von einem Viertel */
    var sUngK = JSON.parse(JSON.stringify(sUng));
    sUngK.tiere[0].anzahl = 20;                                        // 900 dt TS → Deckel 225 < 250
    t(GI, "Deckel von ¼ des GFprod greift bei kleinem Grundfutterbedarf", E.berechne(sUngK).T, 0.4 * 225, 0.01);
    var sStr = V.leer(); sStr.betrieb.ln = 30;
    sStr.tiere = [{ tier: "mutterkuh_m", anzahl: 20, vollmist: 0 }];
    sStr.gfVerlust = 0; sStr.gfFehler = 0;
    sStr.kulturen = [{ kultur: "streue", flaeche: 10, ertrag: 15 }];
    t(GI, "Streuefläche liefert Grundfutter", E.berechne(sStr).gfKulturenTS, 150, 0.01);

    /* Nährstoffarmes GF senkt den Anfall in A2 */
    var sArm = V.leer(); sArm.betrieb.ln = 20;
    sArm.tiere = [{ tier: "mutterkuh_m", anzahl: 10, vollmist: 0 }];
    sArm.kulturen = [{ kultur: "wi_ext", flaeche: 10, ertrag: 25 }];      // 250 dt TS arm
    var rArm = E.berechne(sArm);
    t(GI, "Abzug nährstoffarmes GF – N", rArm.abzArmN, 250 * 0.6, 0.01);
    t(GI, "Abzug nährstoffarmes GF – P₂O₅", rArm.abzArmP, 250 * 0.1, 0.01);
    t(GI, "A2 = A1 − Abzug nährstoffarm", rArm.A2.nges, rArm.A1.nges - 250 * 0.6, 0.01);

    /* Gesamtbilanz-Identität: F = A2 − C + A3 + D + E − T */
    var rB = E.berechne(V.betrieb());
    t(GI, "Bilanzidentität N: A2verf − C + A3verf + D + E", rB.bilN,
      rB.A2verf - rB.C.n + rB.A3verf + rB.D.nverf + rB.E.nverf, 0.001);
    t(GI, "Bilanzidentität P₂O₅: A2 − C + A3 + D + E − T", rB.bilP,
      rB.A2.p - rB.C.p + rB.A3.p + rB.D.p + rB.E.p - rB.T, 0.001);
    /* Teilsummen C1+C2+C3+BFF müssen das Total C ergeben */
    t(GI, "C1 + C2 + C3 + BFF = C (Stickstoff)", rB.C1.n + rB.C2.n + rB.C3.n + rB.CB.n, rB.C.n, 0.001);
    t(GI, "C1 + C2 + C3 + BFF = C (Phosphor)", rB.C1.p + rB.C2.p + rB.C3.p + rB.CB.p, rB.C.p, 0.001);
    /* Summe der Tierzeilen muss A1 ergeben */
    var sumNges = rB.tierRows.reduce(function (a, x) { return a + x.nges; }, 0);
    var sumGf = rB.tierRows.reduce(function (a, x) { return a + x.gf; }, 0);
    t(GI, "Summe Tierzeilen = A1 Nges", sumNges, rB.A1.nges, 0.001);
    t(GI, "Summe Tierzeilen = A1 Grundfutterverzehr", sumGf, rB.A1.gf, 0.001);
    /* Summe der Kulturzeilen muss C ergeben */
    var sumCn = rB.kultRows.reduce(function (a, x) { return a + x.n; }, 0);
    t(GI, "Summe Kulturzeilen = C Stickstoff", sumCn, rB.C.n, 0.001);

    /* Linearität: doppelter Tierbestand → doppelter Anfall */
    var sLin1 = V.leer(); sLin1.betrieb.ln = 10;
    sLin1.tiere = [{ tier: "schaf", anzahl: 50, vollmist: 0 }];
    var sLin2 = V.leer(); sLin2.betrieb.ln = 10;
    sLin2.tiere = [{ tier: "schaf", anzahl: 100, vollmist: 0 }];
    t(GI, "Doppelter Tierbestand → doppelter Nges-Anfall",
      E.berechne(sLin2).A1.nges, 2 * E.berechne(sLin1).A1.nges, 0.001);

    /* Eigene Kulturen und Tiere mit selbst gepflegten Referenzwerten */
    var sEigen = V.leer(); sEigen.betrieb.ln = 10;
    sEigen.kulturen = [{ eigen: { label: "Eigene Kultur", modus: "flach", n: 100, p: 50, k: 80, mg: 10, bereich: "ackerbau" }, flaeche: 3 }];
    sEigen.tiere = [{ eigen: { label: "Eigene Kategorie", einheit: "Pl", gf: 10, nges: 20, p: 8, k: 30, mg: 2, raufutter: true }, anzahl: 5, vollmist: 0 }];
    var rEigen = E.berechne(sEigen);
    t(GI, "Eigene Kultur: N-Bedarf", rEigen.C.n, 300, 0.01);
    t(GI, "Eigene Tierkategorie: Nges", rEigen.A1.nges, 100, 0.01);
    t(GI, "Eigene Tierkategorie: Grundfutterverzehr", rEigen.A1.gf, 50, 0.01);

    /* Überschriebene Referenzwerte (z. B. neue Wegleitungsversion) */
    var sOv = V.leer(); sOv.betrieb.ln = 10;
    sOv.kulturen = [{ kultur: "zwiebeln", flaeche: 2, override: { n: 999 } }];
    t(GI, "Überschriebener Referenzwert wird verwendet", E.berechne(sOv).C.n, 1998, 0.01);

    /* Ertragskorrektur abschaltbar */
    var sNoKorr = V.leer(); sNoKorr.betrieb.ln = 10;
    sNoKorr.kulturen = [{ kultur: "wweizen", flaeche: 1, ertrag: 80, ertragKorrektur: false }];
    t(GI, "Abgeschaltete Ertragskorrektur nutzt die Norm", E.berechne(sNoKorr).C.n, 140, 0.01);

    /* Referenzdaten-Integrität */
    var GD = "Referenzdaten";
    var idsT = {}, dupT = 0;
    D.TIERE.forEach(function (x) { if (idsT[x.id]) dupT++; idsT[x.id] = 1; });
    tBool(GD, "Tierkategorien haben eindeutige Kennungen", dupT === 0, "keine Doubletten");
    var idsK = {}, dupK = 0;
    D.KULTUREN.forEach(function (x) { if (idsK[x.id]) dupK++; idsK[x.id] = 1; });
    tBool(GD, "Kulturen haben eindeutige Kennungen", dupK === 0, "keine Doubletten");
    var badT = D.TIERE.filter(function (x) {
      return !x.label || !isFinite(x.nges) || !isFinite(x.p) || !isFinite(x.gf) || x.nges < 0 || x.p < 0;
    });
    tBool(GD, "Alle Tierkategorien haben gültige Werte", badT.length === 0, "0 fehlerhaft");
    var badK = D.KULTUREN.filter(function (x) {
      return !x.label || (x.modus !== "null" && (!isFinite(x.n) || !isFinite(x.p) || x.n < 0 || x.p < 0));
    });
    tBool(GD, "Alle Kulturen haben gültige Werte", badK.length === 0, "0 fehlerhaft");
    var badKorr = D.KULTUREN.filter(function (x) { return x.korr && (!(x.korr.max > x.korr.std) || !(x.korr.kf > 0)); });
    tBool(GD, "Ertragskorrekturen sind schlüssig (max > Standard)", badKorr.length === 0, "0 fehlerhaft");
    tBool(GD, "Jede Kultur ist einem Bereich zugeordnet", D.KULTUREN.every(function (x) {
      return ["futterbau", "ackerbau", "spezial", "bff"].indexOf(x.bereich) >= 0;
    }), "alle zugeordnet");
    /* Jede Kultur muss rechenbar sein */
    var unrechenbar = D.KULTUREN.filter(function (x) {
      var res = E.kulturBedarf(x, 1, E.standardErtrag(x, "h600"), true);
      return !isFinite(res.n) || !isFinite(res.p) || !isFinite(res.k) || !isFinite(res.mg);
    });
    tBool(GD, "Alle " + D.KULTUREN.length + " Kulturen liefern endliche Werte", unrechenbar.length === 0, "0 fehlerhaft");
    var unrechenbarT = D.TIERE.filter(function (x) {
      var w = E.tierWerte({ tier: x.id, anzahl: 1 });
      return !w || !isFinite(w.nges) || !isFinite(w.gf) || !isFinite(w.p);
    });
    tBool(GD, "Alle " + D.TIERE.length + " Tierkategorien liefern endliche Werte", unrechenbarT.length === 0, "0 fehlerhaft");

    /* Stichproben aus Tab. 1 – die im Betrieb verwendeten und häufigsten Kategorien */
    [
      ["milchkuh", 56, 95.20, 39], ["mutterkuh_m", 45, 68.00, 28], ["jungvieh_12", 26, 36.13, 14],
      ["pferd_gross", 28, 30.10, 21], ["pony", 10.4, 10.99, 8.2],
      ["milchschaf", 9.3, 13.66, 6.6], ["schaf", 6.5, 8.11, 3.8], ["jungschaf", 4.9, 8.36, 3.5],
      ["lamm", 1.4, 2.85, 1.5], ["milchziege", 6.2, 7.87, 3.6], ["ziege", 5.7, 6.96, 3.3],
      ["mastschwein_pl", 0, 10.40, 5.3], ["legehenne_band", 0, 56.00, 46]
    ].forEach(function (x) {
      var tk = D.tier(x[0]);
      t(GD, "Tab. 1 – " + tk.label + ": GF/Nges/P₂O₅",
        tk.gf * 1e6 + tk.nges * 1e3 + tk.p, x[1] * 1e6 + x[2] * 1e3 + x[3], 0.001);
    });
    /* Stichproben aus Tab. 4/5/6 */
    [
      ["wweizen", 140, 0.83], ["dinkel", 100, 0.80], ["silomais", 110, 0.58],
      ["zuckerrueben", 100, 0.06], ["kart_speise_c", 160, 0.16], ["kart_pflanz_b", 100, 0.19],
      ["fenchel", 160, 30], ["zwiebeln", 130, 60], ["salate_mittel", 90, 20],
      ["kuerbis", 150, 60], ["lauch", 200, 40], ["kraeuter_mittel", 70, 30],
      ["gwh_tomaten_1800", 250, 100], ["erdbeeren_1j_20", 100, 34]
    ].forEach(function (x) {
      var kk = D.kultur(x[0]);
      t(GD, "Tab. 4–6 – " + kk.label + ": N/P₂O₅", kk.n * 1e3 + kk.p, x[1] * 1e3 + x[2], 0.001);
    });

    /* Prüfsumme über sämtliche Referenzwerte: schlägt bei jeder unbeabsichtigten
       Änderung an Tab. 1 bzw. Tab. 3–6 an. Bei einer neuen Wegleitungsversion
       müssen diese beiden Sollwerte bewusst nachgeführt werden. */
    function digest(arr, felder) {
      var s = 0;
      arr.forEach(function (x, i) {
        felder.forEach(function (f, j) {
          var v = x[f];
          if (typeof v === "number" && isFinite(v)) s += v * (i + 1) * (j + 7);

  /* =========================================================================
     Register 6 – Bilanz
     ========================================================================= */
  function zeileB(bez, erkl, n, p, klasse) {
    return '<tr' + (klasse ? ' class="' + klasse + '"' : "") + "><td>" + bez +
      (erkl ? '<span class="erklaerung">' + erkl + "</span>" : "") + "</td>" +
      '<td class="num">' + n + '</td><td class="num">' + p + "</td></tr>";
  }
  function rBilanz() {
    var okN = r.ausgeglichenN, okP = r.ausgeglichenP;
    return '<div class="karte"><h2>Gesamtbilanz <span class="form">Formular F</span></h2>' +
      '<p class="hinweis">Die Bilanz gilt als ausgeglichen, wenn die verfügbare Nährstoffmenge den Bedarf der Kulturen nicht übersteigt – ' +
      "der Saldo also null oder negativ ist.</p>" +
      '<div class="rechenweg">Betriebsspezifischer N-Ausnutzungsgrad: 60 % − ' + fmt(r.abzugOA, 1) +
      " % (" + fmt(r.oaProz, 1) + " % offene Ackerfläche × 0.15) − " + fmt(r.abzugVM, 1) +
      " % (" + fmt(r.vollmistProz, 1) + " % Vollmist × 0.12) = <b>" + fmt(r.ausnutzProz, 1) + " %</b></div>" +
      '<table class="bilanztabelle"><thead><tr><th></th><th class="num">Nverf kg</th><th class="num">P₂O₅ kg</th></tr></thead><tbody>' +
      zeileB("Nährstoffe aus der Tierhaltung (A2)",
        "Nges " + fmt(r.A2.nges) + " kg × " + fmt(r.ausnutzProz, 1) + " % Ausnutzungsgrad; Phosphor unverändert",
        fmt(r.A2verf), fmt(r.A2.p)) +
      zeileB("− Nährstoffbedarf der Kulturen (C)",
        "C1 Grundfutter " + fmt(r.C1.n) + " · C2 Ackerbau " + fmt(r.C2.n) + " · C3 Spezialkulturen " + fmt(r.C3.n) + " kg N",
        "−" + fmt(r.C.n), "−" + fmt(r.C.p)) +
      zeileB("Zwischenbilanz",
        "Eigenversorgungsgrad: " + fmt(r.eigenN) + " % beim Stickstoff, " + fmt(r.eigenP) + " % beim Phosphor",
        fmt(r.A2verf - r.C.n), fmt(r.A2.p - r.C.p), "hervor") +
      zeileB("+ Zu- und Wegfuhr unvergärter Hofdünger (A3)",
        "Nges " + fmt(r.A3.nges) + " kg × " + fmt(r.ausnutzProz, 1) + " % Ausnutzungsgrad",
        fmt(r.A3verf), fmt(r.A3.p)) +
      zeileB("+ Zufuhr übriger Dünger (D)", "Mineraldünger, Recyclingdünger, Kompost, Stroh", fmt(r.D.nverf), fmt(r.D.p)) +
      zeileB("+ Vergärungsprodukte und Ernterückstände (E)", "", fmt(r.E.nverf), fmt(r.E.p)) +
      zeileB("− Innerbetrieblicher Nährstofftransfer (T)",
        fmt(r.transferBasis) + " dt TS ungedüngtes Grundfutter × 0.4 kg P₂O₅/dt", "–", "−" + fmt(r.T)) +
      zeileB("<b>Gesamtbilanz</b>", "",
        '<span class="' + (okN ? "gut" : "schlecht") + '">' + fmtS(r.bilN) + "</span>",
        '<span class="' + (okP ? "gut" : "schlecht") + '">' + fmtS(r.bilP) + "</span>", "endsumme") +
      "</tbody></table>" +
      '<div class="kennzahlen">' +
      kennzahl(okN ? "ausgeglichen" : "Überschuss", okN
        ? "Stickstoffbilanz – Reserve " + fmt(-r.bilN) + " kg Nverf (" + fmt(r.C.n ? -100 * r.bilN / r.C.n : 0) + " % des Bedarfs)"
        : "Stickstoffbilanz – " + fmt(r.bilN) + " kg Nverf über dem Bedarf", okN ? "" : "fehler") +
      kennzahl(okP ? "ausgeglichen" : "Überschuss", okP
        ? "Phosphorbilanz – Reserve " + fmt(-r.bilP) + " kg P₂O₅ (" + fmt(r.C.p ? -100 * r.bilP / r.C.p : 0) + " % des Bedarfs)"
        : "Phosphorbilanz – " + fmt(r.bilP) + " kg P₂O₅ über dem Bedarf", okP ? "" : "fehler") +
      kennzahl(fmt(r.df > 0 ? r.zufuhrN / r.df : 0, 1) + " kg", "Verfügbarer Stickstoff je ha düngbare Fläche") +
      kennzahl(fmt(r.df > 0 ? r.zufuhrP / r.df : 0, 1) + " kg", "Phosphor P₂O₅ je ha düngbare Fläche") +
      "</div></div>" +

      '<div class="karte"><h2>Bilanz ausdrucken</h2>' +
      '<p class="hinweis">Der Ausdruck enthält alle Formularteile A bis F mit den Einzelpositionen und Unterschriftsfeldern. ' +
      "Im Druckdialog «Als PDF speichern» wählen.</p>" +
      '<button class="knopf stark" style="background:var(--gruen);color:#fff;border-color:var(--gruen);padding:11px 20px;font-size:14px" onclick="sbDrucken()">Bilanz als PDF ausgeben</button>' +
      "</div>" + rMeldungenKarte();

  function rMeldungenKarte() {
    if (!r.meldungen.length) return '<div class="karte"><h2>Prüfhinweise</h2>' +
      '<div class="meldung erfolg"><span class="sym">✓</span><span>Keine Hinweise – alle Plausibilitätsprüfungen bestanden.</span></div></div>';
    var ordnung = { fehler: 0, warnung: 1, info: 2 };
    var sortiert = r.meldungen.slice().sort(function (a, b) { return ordnung[a.stufe] - ordnung[b.stufe]; });
    return '<div class="karte"><h2>Prüfhinweise</h2>' +
      sortiert.map(function (m) {
        return '<div class="meldung ' + m.stufe + '"><span class="sym">' +
          (m.stufe === "fehler" ? "!" : m.stufe === "warnung" ? "▲" : "i") + "</span><span>" + h(m.text) + "</span></div>";
      }).join("") + "</div>";
  }

  /* =========================================================================
     Register 7 – Düngungsplanung
     ========================================================================= */
  function rPlanung() {
    var p = state.planung;
    /* Zulässige Zufuhr über «übrige Dünger», damit die Bilanz gerade ausgeglichen bleibt */
    var spielraumN = r.C.n - r.A2verf - r.A3verf - r.E.nverf;
    var spielraumP = r.C.p - r.A2.p - r.A3.p - r.E.p + r.T;

    var summeN = 0, summeP = 0;
    var zeilen = p.duenger.map(function (d, i) {
      var n = E.num(d.menge) * E.num(d.nverf), pp = E.num(d.menge) * E.num(d.p);
      summeN += n; summeP += pp;
      return "<tr><td>" + text("planung.duenger." + i + ".name", d.name, { platzhalter: "Dünger" }) + "</td>" +
        "<td>" + wahl("planung.duenger." + i + ".einheit", d.einheit || "t", [["t", "Tonnen"], ["m³", "Kubikmeter"], ["kg", "Kilogramm"]]) + "</td>" +
        '<td class="num">' + zahl("planung.duenger." + i + ".menge", d.menge, { step: 0.1, klasse: "klein" }) + "</td>" +
        '<td class="num">' + zahl("planung.duenger." + i + ".nverf", d.nverf, { step: 0.01, klasse: "klein" }) + "</td>" +
        '<td class="num">' + zahl("planung.duenger." + i + ".p", d.p, { step: 0.01, klasse: "klein" }) + "</td>" +
        '<td class="num abgeleitet">' + fmt(n) + '</td><td class="num abgeleitet">' + fmt(pp) + "</td>" +
        '<td><button class="iknopf" onclick="sbLoesche(\'planung.duenger\',' + i + ')">✕</button></td></tr>';
    }).join("");

    var kulturZeilen = "", normTotal = 0, planTotal = 0;
    r.kultRows.forEach(function (kr) {
      if (kr.modus === "null" || kr.flaeche <= 0) return;
      var geplant = p.proKultur[kr.idx];
      var g = geplant === undefined || geplant === "" ? "" : E.num(geplant);
      var total = (g === "" ? 0 : g) * kr.flaeche;
      normTotal += kr.n; planTotal += total;
      var anteil = kr.nProHa > 0 && g !== "" ? 100 * g / kr.nProHa : null;
      kulturZeilen += "<tr><td>" + h(kr.label) + "</td>" +
        '<td class="num abgeleitet">' + fmt(kr.flaeche, 2) + "</td>" +
        '<td class="num abgeleitet">' + fmt(kr.nProHa) + "</td>" +
        '<td class="num abgeleitet">' + fmt(kr.n) + "</td>" +
        '<td class="num">' + zahl("planung.proKultur." + kr.idx, geplant, { step: 5, klasse: "klein" }) + "</td>" +
        '<td class="num abgeleitet">' + (g === "" ? "–" : fmt(total)) + "</td>" +
        '<td class="num">' + (anteil === null ? (g !== "" && g > 0 ? '<span class="etikett rot">Norm 0</span>' : "–")
          : '<span class="etikett ' + (anteil > 110 ? "rot" : anteil > 100 ? "gelb" : "gruen") + '">' + fmt(anteil) + " %</span>") + "</td></tr>";
    });

    var ausschoepfN = spielraumN > 0 ? 100 * summeN / spielraumN : (summeN > 0 ? 999 : 0);
    var ausschoepfP = spielraumP > 0 ? 100 * summeP / spielraumP : (summeP > 0 ? 999 : 0);
    var gesamtNverf = summeN + r.A2verf + r.A3verf + r.E.nverf;
    var g = p.grenzwerte;
    var prozentNorm = r.C.n > 0 ? 100 * gesamtNverf / r.C.n : 0;
    var nProHa = r.df > 0 ? gesamtNverf / r.df : 0;

    return '<div class="karte"><h2>Spielraum aus der Bilanz</h2>' +
      '<p class="hinweis">Wie viel Stickstoff und Phosphor über zugekaufte Dünger noch zugeführt werden darf, ohne dass die Bilanz kippt. ' +
      "Die Werte stammen direkt aus den Registern 1 bis 5 – es gibt keine getrennte Datenhaltung.</p>" +
      '<div class="kennzahlen">' +
      kennzahl(fmt(spielraumN) + " kg", "Zulässige Zufuhr über übrige Dünger (Nverf)", spielraumN < 0 ? "fehler" : "") +
      kennzahl(fmt(spielraumP) + " kg", "Zulässige Zufuhr über übrige Dünger (P₂O₅)", spielraumP < 0 ? "fehler" : "") +
      kennzahl(fmt(ausschoepfN) + " %", "Ausschöpfung des Stickstoff-Spielraums durch die Planung", ausschoepfN > 100 ? "fehler" : ausschoepfN > 90 ? "warn" : "") +
      kennzahl(fmt(ausschoepfP) + " %", "Ausschöpfung des Phosphor-Spielraums durch die Planung", ausschoepfP > 100 ? "fehler" : ausschoepfP > 90 ? "warn" : "") +
      "</div></div>" +

      '<div class="karte"><h2>Geplanter Düngereinsatz</h2>' +
      '<p class="hinweis">Mengen und Gehalte der Dünger, die eingekauft bzw. eingesetzt werden sollen. Gehalte je Einheit gemäss Lieferschein oder Gehaltsattest.</p>' +
      '<div class="tabellenrahmen"><table><thead><tr><th>Dünger</th><th>Einheit</th><th class="num">Menge</th>' +
      '<th class="num">Nverf je Einheit</th><th class="num">P₂O₅ je Einheit</th><th class="num">Nverf total</th>' +
      '<th class="num">P₂O₅ total</th><th></th></tr></thead><tbody>' + zeilen +
      '<tr class="summe"><td colspan="5">Total geplante Dünger</td><td class="num">' + fmt(summeN) +
      '</td><td class="num">' + fmt(summeP) + "</td><td></td></tr></tbody></table></div>" +
      '<button class="plus" onclick="sbPlanDuengHinzu()">+ Dünger</button></div>' +

      '<div class="karte"><h2>Düngung je Kultur</h2>' +
      '<p class="hinweis">Die Norm entspricht dem Netto-Nährstoffbedarf gemäss Wegleitung. Leguminosen und Biodiversitätsförderflächen haben eine Norm von null, ' +
      "binden aber Stickstoff – das in der Fruchtfolge mitdenken.</p>" +
      '<div class="tabellenrahmen"><table><thead><tr><th>Kultur</th><th class="num">Fläche ha</th><th class="num">Norm kg N/ha</th>' +
      '<th class="num">Norm total kg</th><th class="num">Geplant kg N/ha</th><th class="num">Geplant total kg</th>' +
      '<th class="num">Anteil Norm</th></tr></thead><tbody>' + kulturZeilen +
      '<tr class="summe"><td>Total</td><td></td><td></td><td class="num">' + fmt(normTotal) +
      '</td><td></td><td class="num">' + fmt(planTotal) + '</td><td class="num">' +
      (normTotal > 0 ? fmt(100 * planTotal / normTotal) + " %" : "–") + "</td></tr></tbody></table></div>" +
      '<p class="hinweis">Geplante Kulturdüngung ' + fmt(planTotal) + " kg N gegenüber verfügbaren " + fmt(summeN) +
      " kg Nverf aus den geplanten Düngern – Differenz " + fmtS(summeN - planTotal) + " kg.</p></div>" +

      '<div class="karte"><h2>Betriebliche Leitplanken</h2>' +
      '<p class="hinweis">Frei wählbare Grenzwerte für die interne Kontrolle, zum Beispiel aus den Richtlinien des biologischen Landbaus. ' +
      "Diese Werte sind nicht Teil der Suisse-Bilanz und mit den geltenden Richtlinien abzugleichen.</p>" +
      '<div class="feldgruppe">' +
      '<div class="feld"><label>Prüfung aktiv</label>' + wahl("planung.grenzwerte.aktiv", g.aktiv ? "ja" : "nein", [["ja", "Ja"], ["nein", "Nein"]]) + "</div>" +
      '<div class="feld"><label>Höchstanteil an der N-Norm <span class="einheit">%</span></label>' + zahl("planung.grenzwerte.maxProzentNorm", g.maxProzentNorm, { step: 1, klasse: "klein" }) + "</div>" +
      '<div class="feld"><label>Höchstwert Nverf je ha DF <span class="einheit">kg/ha</span></label>' + zahl("planung.grenzwerte.maxNproHa", g.maxNproHa, { step: 0.5, klasse: "klein" }) + "</div>" +
      "</div>" +
      (String(g.aktiv) === "ja" || g.aktiv === true ? '<div class="kennzahlen">' +
        kennzahl(fmt(prozentNorm) + " %", "Gesamter verfügbarer Stickstoff in Prozent der Norm (Grenzwert " + fmt(g.maxProzentNorm) + " %)",
          prozentNorm > E.num(g.maxProzentNorm) ? "warn" : "") +
        kennzahl(fmt(nProHa, 1) + " kg/ha", "Nverf je ha düngbare Fläche (Grenzwert " + fmt(g.maxNproHa, 1) + " kg/ha)",
          nProHa > E.num(g.maxNproHa) ? "warn" : "") +
        "</div>" : "") +
      "</div>";
  }
  window.sbPlanDuengHinzu = function () { state.planung.duenger.push({ name: "", einheit: "t", menge: 0, nverf: 0, p: 0 }); aktualisieren(); };

  /* =========================================================================
     Register – Prüfung
     ========================================================================= */
  var testCache = null;
  function rPruefung() {
    if (!testCache) testCache = T.suite();
    var gruppen = [];
    testCache.tests.forEach(function (t) { if (gruppen.indexOf(t.gruppe) < 0) gruppen.push(t.gruppe); });
    var html = gruppen.map(function (gr) {
      var liste = testCache.tests.filter(function (t) { return t.gruppe === gr; });
      var ok = liste.filter(function (t) { return t.ok; }).length;
      var alleOk = ok === liste.length;
      return '<div class="testgruppe"><div class="kopf"><span>' + (alleOk ? "✓ " : "✗ ") + h(gr) + "</span>" +
        '<span class="etikett ' + (alleOk ? "gruen" : "rot") + '">' + ok + " / " + liste.length + "</span></div>" +
        (alleOk ? "" : '<div class="testliste">' + liste.filter(function (t) { return !t.ok; }).map(function (t) {
          return '<div class="testzeile rot"><span class="st schlecht">✗</span><span class="nm">' + h(t.name) +
            '</span><span class="vl">ist ' + (typeof t.ist === "number" ? fmt(t.ist, 3) : h(t.ist)) +
            " · soll " + (typeof t.soll === "number" ? fmt(t.soll, 3) : h(t.soll)) + "</span></div>";
        }).join("") + "</div>") + "</div>";
    }).join("");

    return '<div class="karte"><h2>Selbstprüfung des Rechenwerks</h2>' +
      '<p class="hinweis">Der Rechenkern wird bei jedem Aufruf gegen die Rechenbeispiele der Wegleitung, gegen eine vollständig ' +
      "gerechnete Bilanz dieses Betriebs sowie gegen Prüfsummen sämtlicher Referenzwerte getestet. Schlägt ein Test fehl, " +
      "ist den Ergebnissen nicht zu trauen.</p>" +
      '<div class="meldung ' + (testCache.alleOk ? "erfolg" : "fehler") + '"><span class="sym">' +
      (testCache.alleOk ? "✓" : "!") + "</span><span><b>" + testCache.bestanden + " von " + testCache.total +
      " Prüfungen bestanden.</b> " + (testCache.alleOk
        ? "Das Rechenwerk arbeitet wie in der Wegleitung Suisse-Bilanz beschrieben."
        : "Es bestehen Abweichungen – bitte die betroffenen Punkte prüfen.") + "</span></div>" +
      html + "</div>" +

      '<div class="karte"><h2>Prüfhinweise zur aktuellen Bilanz</h2>' +
      (r.meldungen.length ? "" : '<p class="hinweis">Keine offenen Punkte.</p>') + "</div>" +
      rMeldungenKarte() +

      '<div class="karte"><h2>Grundlagen</h2>' +
      '<p class="hinweis">Referenzmethode: Wegleitung Suisse-Bilanz, Version ' + h(state.version) +
      ". Referenzwerte aus den Tabellen 1 bis 6 der Wegleitung: " + D.TIERE.length + " Tierkategorien und " +
      D.KULTUREN.length + " Kulturen. Umgesetzt sind die elf Berechnungsschritte einschliesslich der Korrekturen für " +
      "Milchkühe, Rindviehmast und Kleinwiederkäuer, der ertragsabhängigen N-Korrektur, der Laufhof- und Weideabzüge, " +
      "des Vollmistanteils, des betriebsspezifischen N-Ausnutzungsgrads und des innerbetrieblichen Nährstofftransfers.</p>" +
      '<p class="hinweis">Dieses Werkzeug ist ein betriebseigenes Hilfsmittel und ersetzt weder die Referenzmethode noch eine amtliche Prüfung. ' +
      "Massgebend sind die Wegleitung und die geltende Gesetzgebung.</p></div>";
  }

  var REGISTER = [
